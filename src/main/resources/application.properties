server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marketing_facil}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:marketing_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:marketing_app}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.thymeleaf.cache=true
app.upload-dir=${UPLOAD_DIR:/app/uploads}
